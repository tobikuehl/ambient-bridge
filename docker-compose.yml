services:
  bridge-api:
    build: ./backend
    container_name: ambient-bridge-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  mdns-announcer:
    build: ./backend
    container_name: ambient-bridge-mdns
    restart: unless-stopped
    network_mode: host
    command: ["python", "mdns.py"]

  caddy:
    image: caddy:2-alpine
    container_name: ambient-bridge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bridge-api

volumes:
  caddy_data:
